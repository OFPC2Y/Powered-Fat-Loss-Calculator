<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>带电操作减脂食谱计算器</title>
<style>
  :root {
    --bg: #f5f7fa;
    --card: #ffffff;
    --primary: #0ea5a0;
    --primary-light: #eefdfc;
    --primary-dark: #0f766e;
    --text: #1e293b;
    --text-secondary: #64748b;
    --border: #e2e8f0;
    --radius: 16px;
    --shadow: 0 4px 24px rgba(0,0,0,0.06);
    --green: #16a34a;
    --orange: #f59e0b;
    --red: #dc2626;
    --blue: #2563eb;
    --purple: #8b5cf6;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 20px;
    line-height: 1.6;
  }
  .container { max-width: 1120px; margin: 0 auto; padding-bottom: 80px; }
  header { text-align: center; padding: 28px 0 20px; }
  header h1 {
    font-size: 28px; font-weight: 800;
    background: linear-gradient(135deg, var(--primary), var(--blue));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  header p { color: var(--text-secondary); margin-top: 6px; font-size: 14px; }

  .layout { display: grid; grid-template-columns: 420px 1fr; gap: 22px; align-items: start; }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }

  .card {
    background: var(--card); border-radius: var(--radius); padding: 20px;
    box-shadow: var(--shadow); border: 1px solid var(--border); margin-bottom: 16px;
  }
  .card h2 {
    font-size: 15px; font-weight: 700; margin-bottom: 14px; display: flex; align-items: center; gap: 8px;
  }
  .card h2 .icon { width: 26px; height: 26px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; font-size: 14px; }

  details.form-section { border: 1px solid var(--border); border-radius: 14px; background: var(--card); margin-bottom: 12px; box-shadow: var(--shadow); overflow: hidden; }
  details.form-section > summary {
    list-style: none; cursor: pointer; padding: 14px 18px; font-weight: 700; font-size: 14px;
    display: flex; align-items: center; gap: 8px; user-select: none; color: var(--text);
  }
  details.form-section > summary::-webkit-details-marker { display: none; }
  details.form-section > summary .arrow { margin-left: auto; color: var(--text-secondary); transition: transform .2s; }
  details.form-section[open] > summary .arrow { transform: rotate(180deg); }
  details.form-section > .body { padding: 2px 18px 18px; }

  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-group { margin-bottom: 12px; }
  .form-group label { display: block; font-size: 12.5px; font-weight: 600; color: var(--text-secondary); margin-bottom: 4px; }
  .form-group input, .form-group select, .form-group textarea {
    width: 100%; padding: 9px 11px; border: 1.5px solid var(--border); border-radius: 10px;
    font-size: 14.5px; color: var(--text); background: var(--card); outline: none; font-family: inherit;
    transition: border-color .2s;
  }
  .form-group textarea { resize: vertical; min-height: 56px; }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(14,165,160,0.12); }
  .form-group .hint { font-size: 11.5px; color: var(--text-secondary); margin-top: 3px; }

  .gender-toggle { display: flex; gap: 8px; }
  .gender-btn { flex: 1; padding: 9px; border-radius: 10px; border: 1.5px solid var(--border); background: var(--card); cursor: pointer; font-size: 14px; text-align: center; color: var(--text-secondary); transition: all .15s; }
  .gender-btn.active-male { border-color: var(--blue); background: #eff6ff; color: var(--blue); font-weight: 700; }
  .gender-btn.active-female { border-color: #ec4899; background: #fdf2f8; color: #ec4899; font-weight: 700; }

  .check-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px 14px; }
  .check-item { display: flex; align-items: center; gap: 7px; font-size: 13.5px; color: var(--text); cursor: pointer; }
  .check-item input { width: 15px; height: 15px; accent-color: var(--primary); }

  .btn-calc {
    width: 100%; padding: 13px; background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: #fff; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer;
    transition: opacity .2s, transform .1s;
  }
  .btn-calc:hover { opacity: .93; }
  .btn-calc:active { transform: scale(.99); }

  /* 结果区 */
  #placeholder-area .card { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 380px; text-align: center; }
  .banner { padding: 14px 16px; border-radius: 12px; font-size: 13.5px; margin-bottom: 14px; line-height: 1.7; }
  .banner.warn { background: #fffbeb; border: 1px solid #fde68a; color: #92400e; }
  .banner.risk { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; }
  .banner.info { background: var(--primary-light); border: 1px solid #99f6e4; color: #134e4a; }
  .banner b { font-weight: 700; }

  .stat-group { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
  @media (max-width: 560px) { .stat-group { grid-template-columns: 1fr 1fr; } }
  .stat-card { background: var(--bg); border-radius: 12px; padding: 14px; text-align: center; }
  .stat-card .stat-label { font-size: 11.5px; color: var(--text-secondary); font-weight: 600; }
  .stat-card .stat-value { font-size: 26px; font-weight: 800; margin: 2px 0; }
  .stat-card .stat-unit { font-size: 12px; color: var(--text-secondary); }
  .stat-card.t1 .stat-value { color: var(--blue); }
  .stat-card.t2 .stat-value { color: var(--primary); }
  .stat-card.t3 .stat-value { color: var(--orange); }

  .macro-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
  @media (max-width: 560px) { .macro-grid { grid-template-columns: 1fr; } }
  .macro-card { border-radius: 12px; padding: 14px; text-align: center; border: 1.5px solid var(--border); }
  .macro-card.protein { border-color: #bfdbfe; background: #eff6ff; }
  .macro-card.carbs { border-color: #fde68a; background: #fffbeb; }
  .macro-card.fat { border-color: #fecaca; background: #fef2f2; }
  .macro-card .macro-name { font-size: 12px; font-weight: 700; letter-spacing: .5px; }
  .macro-card .macro-grams { font-size: 25px; font-weight: 800; margin: 2px 0; }
  .macro-card .macro-kcal { font-size: 12px; color: var(--text-secondary); }
  .macro-card.protein .macro-grams { color: var(--blue); }
  .macro-card.carbs .macro-grams { color: var(--orange); }
  .macro-card.fat .macro-grams { color: var(--red); }

  .section-title { font-size: 15px; font-weight: 700; margin: 20px 0 10px; display: flex; align-items: center; gap: 8px; }
  .section-title .icon { width: 26px; height: 26px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; font-size: 14px; }

  .meal-card { border: 1.5px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  .meal-card .meal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .meal-card .meal-name { font-weight: 800; font-size: 14.5px; }
  .meal-card .meal-kcal { font-size: 12.5px; color: var(--text-secondary); }
  .meal-item { display: flex; align-items: center; gap: 8px; padding: 5px 0; font-size: 14px; border-bottom: 1px dashed var(--border); }
  .meal-item:last-child { border-bottom: none; }
  .meal-item .food { font-weight: 600; }
  .meal-item .amt { color: var(--primary-dark); font-weight: 700; white-space: nowrap; }
  .meal-item .how { color: var(--text-secondary); font-size: 12.5px; margin-left: auto; text-align: right; }
  .swap-selects { margin-top: 10px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px 12px; }
  .swap-select { display: flex; align-items: center; gap: 8px; }
  .swap-select label { font-size: 12.5px; font-weight: 600; color: var(--text-secondary); white-space: nowrap; }
  .swap-select select { flex: 1; min-width: 0; padding: 6px 8px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 13px; color: var(--text); background: var(--card); outline: none; font-family: inherit; cursor: pointer; }
  .swap-select select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(14,165,160,0.12); }
  .swap-note { grid-column: 1 / -1; font-size: 12px; color: var(--text-secondary); }

  table.buy { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  table.buy th, table.buy td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--border); }
  table.buy th { font-size: 12px; color: var(--text-secondary); font-weight: 700; background: var(--bg); }
  table.buy td.num { white-space: nowrap; }

  .detail-row { display: flex; justify-content: space-between; padding: 5px 0; font-size: 13.5px; border-bottom: 1px solid var(--border); }
  .detail-row:last-child { border-bottom: none; }
  .detail-row .label { color: var(--text-secondary); }
  .detail-row .value { font-weight: 600; text-align: right; }

  .check-list { margin-top: 8px; }
  .check-item-row { padding: 7px 10px; border-radius: 8px; font-size: 13px; margin-bottom: 5px; }
  .check-item-row.pass { background: #f0fdf4; color: #166534; }
  .check-item-row.warn { background: #fffbeb; color: #92400e; }

  .footnote { margin-top: 14px; padding: 12px 14px; background: var(--bg); border-radius: 10px; font-size: 12px; color: var(--text-secondary); line-height: 1.8; }
  .hidden { display: none; }

  /* 保存 PDF：右下角悬浮按钮 */
  .btn-pdf {
    position: fixed; right: 20px; bottom: 20px; z-index: 1000;
    padding: 12px 20px; border: none; border-radius: 999px;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff;
    font-size: 15px; font-weight: 700; cursor: pointer;
    box-shadow: 0 6px 20px rgba(14,165,160,.35);
    transition: transform .15s, opacity .2s;
  }
  .btn-pdf:hover { transform: translateY(-2px); }
  .btn-pdf:disabled { opacity: .6; cursor: wait; }

  /* 浮动「生成我的减脂方案」按钮：与原按钮同款，仅当原按钮滚到视口上方后出现，
     贴在左侧表单列同一位置；滑回原按钮（如页面底部）时自动归位隐藏。 */
  .btn-float-calc {
    position: fixed;
    left: max(20px, calc((100vw - 1120px) / 2));
    bottom: 20px;
    width: 420px;
    max-width: calc(100vw - 40px);
    z-index: 999;
    padding: 13px;
    border: none; border-radius: 12px;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff;
    font-size: 16px; font-weight: 700; cursor: pointer;
    box-shadow: 0 6px 20px rgba(14,165,160,.35);
    transition: transform .18s, opacity .2s;
    opacity: 0; pointer-events: none; transform: translateY(10px);
  }
  .btn-float-calc.show { opacity: 1; pointer-events: auto; transform: translateY(0); }
  .btn-float-calc:hover { opacity: .93; }
  @media (max-width: 900px) {
    .btn-float-calc { left: 20px; right: 20px; width: auto; }
  }

  /* PDF 导出临时渲染区（屏幕外，供 html2canvas 截图；打印时移回可视区） */
  #pdfHolder {
    position: absolute; left: -10000px; top: 0; width: 760px;
    background: #fff; color: #1e293b; font-size: 13px; line-height: 1.6;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  #pdfHolder .sec { width: 720px; margin: 0 auto 20px; }
  #pdfHolder .ptitle { font-size: 24px; font-weight: 800; text-align: center; margin: 8px 0 2px; color: #0f766e; }
  #pdfHolder .pdate { font-size: 12px; color: #64748b; text-align: center; margin-bottom: 14px; }
  #pdfHolder .sec h2 { font-size: 15px; font-weight: 800; margin: 0 0 10px; padding: 8px 12px; background: #f1f5f9; border-radius: 8px; color: #0f766e; }
  #pdfHolder .kv { width: 100%; border-collapse: collapse; font-size: 13px; }
  #pdfHolder .kv td { padding: 5px 10px; border-bottom: 1px solid #e2e8f0; vertical-align: top; }
  #pdfHolder .kv td.k { color: #64748b; white-space: nowrap; width: 34%; }
  #pdfHolder .kv td.v { font-weight: 600; }
  #pdfHolder .warn { font-size: 12.5px; color: #92400e; background: #fffbeb; border: 1px solid #fde68a; border-radius: 8px; padding: 8px 12px; margin-bottom: 8px; }
  #pdfHolder .meal { border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; }
  #pdfHolder .meal b { font-size: 13.5px; }
  #pdfHolder .meal table { width: 100%; border-collapse: collapse; margin-top: 6px; font-size: 12.5px; }
  #pdfHolder .meal table td { padding: 3px 8px; border-bottom: 1px dashed #e2e8f0; }
  #pdfHolder .meal table td:first-child { font-weight: 600; }
  #pdfHolder .meal table td:nth-child(2) { color: #0f766e; font-weight: 700; white-space: nowrap; }
  #pdfHolder .meal table td:last-child { color: #64748b; text-align: right; }
  #pdfHolder .buy { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  #pdfHolder .buy th, #pdfHolder .buy td { padding: 5px 8px; text-align: left; border-bottom: 1px solid #e2e8f0; }
  #pdfHolder .buy th { background: #f1f5f9; font-size: 12px; color: #64748b; }
  #pdfHolder .ck { font-size: 12.5px; padding: 6px 10px; border-radius: 6px; margin-bottom: 5px; }
  #pdfHolder .ck.pass { background: #f0fdf4; color: #166534; }
  #pdfHolder .ck.warn { background: #fffbeb; color: #92400e; }
  #pdfHolder .note { font-size: 11.5px; color: #64748b; line-height: 1.7; margin-top: 6px; }
  #pdfHolder .foot { margin-top: 4px; font-size: 11.5px; color: #64748b; line-height: 1.8; }

  @media print {
    body > .container, .btn-pdf { display: none !important; }
    #pdfHolder { position: static !important; left: auto !important; width: auto !important; }
    #pdfHolder .sec { width: auto; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>⚡ 带电操作减脂食谱计算器</h1>
    <p>估算每日能量 → 分配三大营养素 → 生成一日三餐 → 汇总 7 天采购清单</p>
  </header>

  <div class="layout">
    <!-- ============ 左：信息采集 ============ -->
    <div id="form-column">

      <details class="form-section" open>
        <summary><span>① 基础信息</span><span class="arrow">▾</span></summary>
        <div class="body">
          <div class="form-group">
            <label>性别</label>
            <div class="gender-toggle" id="genderToggle">
              <div class="gender-btn" data-gender="male" onclick="setGender('male')">♂ 男性</div>
              <div class="gender-btn active-female" data-gender="female" onclick="setGender('female')">♀ 女性</div>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>年龄（岁）</label><input type="number" id="age" value="25" min="18" max="80"></div>
            <div class="form-group"><label>身高（cm）</label><input type="number" id="height" value="165" min="120" max="230" step="0.5"></div>
          </div>
          <div class="form-group"><label>体重（kg）</label><input type="number" id="weight" value="60" min="30" max="300" step="0.5"></div>
          <div class="form-group">
            <label>目标节奏</label>
            <select id="pace">
              <option value="maintain">维持体重（缺口 0）</option>
              <option value="mild">温和减脂（每日缺口约 300 kcal）</option>
              <option value="standard" selected>标准减脂（每日缺口约 500 kcal）</option>
              <option value="fast">较快减脂（每日缺口约 700 kcal，较激进）</option>
            </select>
            <div class="hint">这是可执行的初始目标（估算值），建议执行 2～3 周后按实际体重变化校准。</div>
          </div>
          <div class="form-group">
            <label>每日餐次</label>
            <select id="mealCount">
              <option value="3" selected>一日三餐</option>
              <option value="5">一日五餐（含两次加餐）</option>
            </select>
          </div>
        </div>
      </details>

      <details class="form-section" open>
        <summary><span>② 工作与活动</span><span class="arrow">▾</span></summary>
        <div class="body">
          <div class="form-group">
            <label>工作性质</label>
            <select id="workType">
              <option value="sedentary" selected>久坐办公室工作</option>
              <option value="light">轻体力工作</option>
              <option value="medium">中等体力工作</option>
              <option value="heavy">重体力工作</option>
            </select>
          </div>
          <div class="form-group">
            <label>日常活动量（工作以外）</label>
            <select id="dailyActivity">
              <option value="minimal">很少（基本不动）</option>
              <option value="low" selected>较少</option>
              <option value="medium">较多</option>
              <option value="high">很多（常走动/家务/遛娃等）</option>
            </select>
          </div>
        </div>
      </details>

      <details class="form-section" open>
        <summary><span>③ 饮食与生活</span><span class="arrow">▾</span></summary>
        <div class="body">
          <div class="form-row">
            <div class="form-group">
              <label>饮食方式</label>
              <select id="cook">
                <option value="home" selected>自己做饭为主</option>
                <option value="both">做饭 + 外食各半</option>
                <option value="eatout">以外食为主</option>
              </select>
            </div>
            <div class="form-group">
              <label>饮食清淡程度</label>
              <select id="taste">
                <option value="light" selected>清淡</option>
                <option value="moderate">比较清淡</option>
                <option value="oily">油腻</option>
                <option value="veryoily">很油腻</option>
              </select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>早餐习惯</label>
              <select id="breakfastHabit">
                <option value="daily" selected>每天都吃</option>
                <option value="sometimes">偶尔吃</option>
                <option value="rarely">基本不吃</option>
              </select>
            </div>
            <div class="form-group">
              <label>午餐主要场景</label>
              <select id="lunchScene">
                <option value="home" selected>自己做</option>
                <option value="canteen">吃食堂</option>
                <option value="takeout">外卖</option>
                <option value="family">家人做</option>
              </select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>晚餐主要场景</label>
              <select id="dinnerScene">
                <option value="home" selected>自己做</option>
                <option value="canteen">吃食堂</option>
                <option value="takeout">外卖</option>
                <option value="family">家人做</option>
              </select>
            </div>
            <div class="form-group">
              <label>每周必要应酬（含聚餐）次数</label>
              <input type="number" id="socialMeals" value="0" min="0" max="14">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>夜食问题</label>
              <select id="nightEating">
                <option value="none" selected>没有</option>
                <option value="sometimes">偶尔有</option>
                <option value="severe">有且严重</option>
              </select>
            </div>
            <div class="form-group">
              <label>暴食问题</label>
              <select id="binge">
                <option value="none" selected>没有</option>
                <option value="sometimes">偶尔有</option>
                <option value="severe">有且严重</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label>饮酒情况</label>
            <select id="drinking">
              <option value="none" selected>不饮酒</option>
              <option value="sometimes">偶尔饮酒</option>
              <option value="heavy">有且大量</option>
            </select>
          </div>
          <div class="form-group">
            <label>当前饮食情况（选填：种类 / 大致量 / 零食等）</label>
            <textarea id="currentDiet" placeholder="简单描述即可，用于配餐参考"></textarea>
          </div>
        </div>
      </details>

      <details class="form-section" open>
        <summary><span>④ 运动与作息</span><span class="arrow">▾</span></summary>
        <div class="body">
          <div class="form-row">
            <div class="form-group">
              <label>当前运动习惯</label>
              <select id="exerciseHabit">
                <option value="none" selected>基本不运动</option>
                <option value="sometimes">偶尔运动</option>
                <option value="1-2">每周 1～2 次</option>
                <option value="3+">每周 3 次以上</option>
              </select>
            </div>
            <div class="form-group">
              <label>力量训练情况</label>
              <select id="strengthHabit">
                <option value="none" selected>无</option>
                <option value="sometimes">偶尔</option>
                <option value="1-2">每周 1～2 次</option>
                <option value="3+">每周 3 次以上</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label>方便使用的运动器械（选填）</label>

/* ---------------- 工具函数 ---------------- */
const byName = (name) => FOOD_DB.find(x => x.name === name);
const round1 = (n) => Math.round(n * 10) / 10;
const round2 = (n) => Math.round(n * 100) / 100;
const clamp = (n, lo, hi) => Math.max(lo, Math.min(hi, n));
const snap5 = (n) => Math.round(n / 5) * 5;   // 四舍五入到 5g（便于采购）
const snap2 = (n) => Math.round(n / 2) * 2;   // 四舍五入到 2g（油脂）
const isEggFood = (f) => f.name === '鸡蛋（全）';

// 营养成分贡献（克数 → 宏量）
function contrib(food, grams) {
  return {
    p: food.p * grams / 100,
    f: food.f * grams / 100,
    c: food.c * grams / 100,
    kcal: food.k * grams / 100,
  };
}
function addMacros(a, b) { return { p: a.p + b.p, f: a.f + b.f, c: a.c + b.c, kcal: a.kcal + b.kcal }; }
function subMacros(a, b) { return { p: a.p - b.p, f: a.f - b.f, c: a.c - b.c, kcal: a.kcal - b.kcal }; }
function scaleMacros(a, r) { return { p: a.p * r, f: a.f * r, c: a.c * r, kcal: a.kcal * r }; }
function roundMacros(a) { return { p: Math.round(a.p), f: Math.round(a.f), c: Math.round(a.c), kcal: Math.round(a.kcal) }; }

/* ---------------- [1] 用户数据层 ---------------- */

/* ---------------- [2] 健康筛查层 ---------------- */
function collectExcludedFoods(p) {
  const exclude = new Set();
  p.allergies.forEach(key => {
    const rule = ALLERGEN_MAP[key];
    if (rule) rule.foods.forEach(f => exclude.add(f));
  });
  // 自由文本
  const texts = [p.allergyDetail, p.dietTaboo];
  texts.forEach(t => {
    if (!t) return;
    TEXT_EXCLUDE_RULES.forEach(rule => {
      if (rule.keys.some(k => t.includes(k))) rule.foods.forEach(f => exclude.add(f));
    });
  });
  return exclude;
}

function healthScreen(p) {
  const blocked = [];
  const warnings = [];
  const exclude = collectExcludedFoods(p);

  if (p.glucoseIssue === 'yes') blocked.push('糖代谢异常');
  if (p.hypoglycemia === 'yes') blocked.push('低血糖');
  if (p.disease) blocked.push('身体疾病');
  if (p.exerciseTaboo) warnings.push('你有运动禁忌（本工具不涉及运动建议，请遵医嘱运动）');
  if (p.otherHealth) warnings.push('你填写了其他异常健康指标，请自行确认当前方案是否适合，必要时咨询专业人士');
  if (p.allergies.length || p.allergyDetail) warnings.push('已记录食物过敏信息，配餐已尽量避开相关食材，请食用前再次核对');
  if (p.dietTaboo) warnings.push('已记录饮食禁忌，配餐已尽量避开相关食材');
  if (p.age < CFG.minAge) blocked.push('年龄未满 18 岁（本工具仅面向成年人）');
  if (p.binge === 'severe') warnings.push('你有较严重的暴食问题，单纯饮食计划可能不够，建议寻求专业支持');
  if (p.drinking === 'heavy') warnings.push('饮酒量大，酒精本身含热量，减脂期建议严格控制');

  const level = blocked.length ? 'block' : (warnings.length ? 'restrict' : 'ok');
  return { level, blocked, warnings, exclude };
}

/* ---------------- [3] 能量估算层 ---------------- */
function mifflin(p) {
  if (p.sex === 'male') return 10 * p.weight + 6.25 * p.height - 5 * p.age + 5;
  return 10 * p.weight + 6.25 * p.height - 5 * p.age - 161;
}

// 活动系数：综合工作性质、日常活动量、运动习惯、力量训练、可用时间（在 1.2~1.9 区间估算）
function activityFactor(p) {
  const workMap = { heavy: 0.30, medium: 0.15, light: 0.05, sedentary: 0.0 };
  const actMap = { high: 0.15, medium: 0.08, low: 0.03, minimal: 0.0 };
  const strengthMap = { '3+': 0.15, '1-2': 0.08, sometimes: 0.04, none: 0.0 };
  let af = 1.2 + (workMap[p.workType] || 0) + (actMap[p.dailyActivity] || 0);
  const ex = p.exerciseMinutes || 0;
  af += ex < 15 ? 0 : ex < 45 ? 0.06 : ex < 90 ? 0.12 : 0.18;
  af += strengthMap[p.strengthHabit] || 0;
  const frag = p.fragmentMinutes || 0;
  af += frag < 30 ? 0 : frag < 90 ? 0.03 : 0.06;
  return round2(clamp(af, 1.2, 1.9));
}

function computeEnergy(p) {
  const bmr = Math.round(mifflin(p));
  const af = activityFactor(p);
  const tdee = Math.round(bmr * af);
  const deficit = CFG.paceDeficits[p.pace] ?? 500;
  const target = tdee - deficit;
  return { bmr, af, tdee, deficit, target };
}

// 体脂率：优先用输入值，否则用 Deurenberg（BMI+年龄）估算
function estimateBfp(p) {
  const bmi = p.weight / Math.pow(p.height / 100, 2);
  const b = p.sex === 'male' ? 1.20 * bmi + 0.23 * p.age - 16.2 : 1.20 * bmi + 0.23 * p.age - 5.4;
  return clamp(Math.round(b), 5, 60);
}

/* ---------------- [4] 宏量营养素层 ---------------- */
function computeMacros(p, energy) {
  const bfp = estimateBfp(p);
  const lbm = p.weight * (1 - bfp / 100);
  const coef = p.pace === 'maintain' ? CFG.proteinPerKgLBM.maintain : CFG.proteinPerKgLBM.lose;
  const protein = Math.round(lbm * coef);
  const fat = Math.round(energy.target * CFG.fatPctOfTarget / 100 / CFG.fatKcalPerG);
  const proteinKcal = protein * CFG.atwater.p;
  const fatKcal = fat * CFG.atwater.f;
  let carbKcal = energy.target - proteinKcal - fatKcal;
  if (carbKcal < 0) {
    // 情况1：营养素最低约束超过目标热量
    return { error: 'conflict', protein, fat, proteinKcal, fatKcal, bfp, lbm, coef, target: energy.target };
  }
  const carb = Math.max(0, Math.round(carbKcal / CFG.atwater.c));
  const carbKcalFinal = carb * CFG.atwater.c;
  const totalKcal = proteinKcal + fatKcal + carbKcalFinal;
  return { protein, fat, carb, proteinKcal, fatKcal, carbKcal: carbKcalFinal, totalKcal, bfp, lbm, coef, error: null };
}

/* ---------------- [5] 配餐层 ---------------- */
function pickFood(roleList, exclude, fallbackIndex) {
  const avail = roleList.filter(n => !exclude.has(n));
  return avail.length ? avail[fallbackIndex % avail.length] : null;
}

function selectFoods(p, exclude) {
  const protein = pickFood(ROLES.protein, exclude, 0);
  const staple = pickFood(ROLES.staple, exclude, 0);
  const veg = pickFood(ROLES.veg, exclude, 0);
  const veg2 = pickFood(ROLES.veg, exclude, 1);
  const oil = pickFood(ROLES.oil, exclude, 0);
  const dairy = pickFood(ROLES.dairy, exclude, 0);
  const fruit = pickFood(ROLES.fruit, exclude, 0);
  return { protein, staple, veg, veg2, oil, dairy, fruit };
}

// 早餐：鸡蛋 + 奶 + 主食（+ 可选水果）
function buildBreakfast(p, m, sel, carbShare, exclude) {
  const items = [];
  let macros = { p: 0, f: 0, c: 0, kcal: 0 };

  // 鸡蛋：过敏/禁忌被排除时，改用所选同类蛋白食材补足约 15g 蛋白质
  if (!exclude.has('鸡蛋（全）')) {
    const egg = byName('鸡蛋（全）');
    const eggQty = 2;
    const eggG = eggQty * CFG.eggGrams;
    items.push({ food: egg, grams: eggG, unit: '个', qty: eggQty, how: '水煮' });
    macros = addMacros(macros, contrib(egg, eggG));
  } else if (sel.protein) {
    const pf = byName(sel.protein);
    const gp = clamp(snap5(15 * 100 / pf.p), 40, 250);
    items.push({ food: pf, grams: gp, unit: 'g', qty: gp, how: proteinHow(pf) });
    macros = addMacros(macros, contrib(pf, gp));
  }

  // 牛奶/奶：被排除时跳过
  if (sel.dairy) {
    const milk = byName(sel.dairy);
    const milkG = 250;
    items.push({ food: milk, grams: milkG, unit: 'ml', qty: milkG, how: '直接饮用' });
    macros = addMacros(macros, contrib(milk, milkG));
  }

  const bfCarb = m.c * carbShare;
  let remCarb = bfCarb - macros.c;
  if (remCarb > 0 && sel.staple) {
    const sf = byName(sel.staple);
    let gs = snap5(remCarb * 100 / sf.c);
    gs = clamp(gs, 30, 300);
    items.push({ food: sf, grams: gs, unit: 'g', qty: gs, how: stapleHow(sf) });
    macros = addMacros(macros, contrib(sf, gs));
  }

  return { name: '早餐', items, macros: roundMacros(macros) };
}

// 加餐：水果（简单、可执行）
function buildSnack(sel, name) {
  const items = [];
  let macros = { p: 0, f: 0, c: 0, kcal: 0 };
  const fruit = byName(sel.fruit);
  const gF = 150;
  items.push({ food: fruit, grams: gF, unit: 'g', qty: gF, how: '洗净生食' });
  macros = addMacros(macros, contrib(fruit, gF));
  return { name, items, macros: roundMacros(macros) };
}

// 正餐：肉/蛋白 + 主食 + 蔬菜 + 油
function buildMainMeal(T, sel, name) {
  const items = [];
  let used = { p: 0, f: 0, c: 0, kcal: 0 };
  let rem = { ...T };

  // 蔬菜先定（固定量，增加饱腹感）
  if (sel.veg) {
    const vf = byName(sel.veg);
    const gv = 200;
    const c3 = contrib(vf, gv);
    items.push({ food: vf, grams: gv, unit: 'g', qty: gv, how: '清炒或水煮' });
    used = addMacros(used, c3);
    rem = subMacros(rem, c3);
  }

  // 蛋白 + 主食 联合求解（主食也含蛋白质，须一并计入，避免蛋白超标）
  const pf = byName(sel.protein);
  const sf = byName(sel.staple);
  const P = rem.p, C = rem.c;
  const pp = pf.p, pc = pf.c, sp = sf.p, sc = sf.c;
  const det = pp * sc - pc * sp;
  let gp, gs;
  if (Math.abs(det) > 1e-9) {
    gp = (100 * P * sc - 100 * C * sp) / det;
    gs = (100 * C * pp - 100 * P * pc) / det;
  } else {
    gp = 100 * P / pp;
    gs = 100 * C / sc;
  }
  // 蛋白取整（鸡蛋按整数个）
  if (isEggFood(pf)) {
    const n = clamp(Math.round(gp / CFG.eggGrams), 1, 3);
    gp = n * CFG.eggGrams;
  } else {
    gp = clamp(snap5(Math.round(gp)), 30, 350);
  }
  // 主食取整（碳水目标过低时不强制主食）
  if (C <= 5) gs = 0;
  else gs = clamp(snap5(Math.round(gs)), 30, 320);

  if (gp > 0) {
    const c1 = contrib(pf, gp);
    items.push({ food: pf, grams: gp, unit: isEggFood(pf) ? '个' : 'g', qty: isEggFood(pf) ? gp / CFG.eggGrams : gp, how: proteinHow(pf) });
    used = addMacros(used, c1);
    rem = subMacros(rem, c1);
  }
  if (gs > 0) {
    const c2 = contrib(sf, gs);
    items.push({ food: sf, grams: gs, unit: 'g', qty: gs, how: stapleHow(sf) });
    used = addMacros(used, c2);
    rem = subMacros(rem, c2);
  }

  // 油（补足脂肪）
  const of = byName(sel.oil);
  let go = Math.round(rem.f);
  go = clamp(go, 0, 20);
  if (go > 0) {
    const c4 = contrib(of, go);
    items.push({ food: of, grams: go, unit: 'g', qty: go, how: '炒菜用油' });
    used = addMacros(used, c4);
  }

  return { name, items, macros: roundMacros(used) };
}

function stapleHow(f) {
  const n = f.name;
  if (n === '大米') return '淘洗后煮饭';
  if (n === '小米') return '煮粥或蒸饭';
  if (n === '面粉') return '做面条/馒头';
  if (n === '玉署黍') return '蒸/煮';
  if (n === '甘薯（红薯）') return '蒸熟';
  if (n === '马铃薯（土豆、洋芋）') return '蒸/煮/少油炒';
  return '蒸/煮';
}
function proteinHow(f) {
  const n = f.name;
  if (n.includes('鱼') || n.includes('虾') || n.includes('蛤') || n.includes('螺') || n.includes('蟹') || n.includes('蛙')) return '清蒸或水煮';
  if (n.includes('豆腐')) return '少油煎或炖';
  if (n.includes('鸡') || n.includes('鸭')) return '煎/水煮/清蒸';
  if (n.includes('牛')) return '少油煎或卤';
  if (n === '鸡蛋（全）') return '水煮';
  return '煎/水煮';
}

function isEatOutScene(scene) { return scene === 'canteen' || scene === 'takeout'; }

// 最小可执行配餐热量：以本工具的最小分量（早餐 1 蛋 + 200ml 奶 + 30g 主食；正餐 30g 蛋白 + 30g 主食 + 200g 蔬菜）估算，
// 用于判断目标热量是否低到无法生成可执行的一日三餐。这是"可执行性"下限，不是生理安全底线。
function minFeasibleKcal() {
  const egg = byName('鸡蛋（全）'), milk = byName('牛奶（鲜）'), rice = byName('大米'), chicken = byName('鸡肉'), veg = byName('菠菜');
  const bf = contrib(egg, 50).kcal + contrib(milk, 200).kcal + contrib(rice, 30).kcal;
  const main = contrib(chicken, 30).kcal + contrib(rice, 30).kcal + contrib(veg, 200).kcal;
  return Math.round(bf + main * 2);
}

function generateDayPlan(p, targets) {
  const exclude = collectExcludedFoods(p);
  const sel = selectFoods(p, exclude);
  if (!sel.protein || !sel.staple || !sel.oil) {
    return { error: 'db_insufficient', sel };
  }
  const m = targets;
  const meals = [];

  // 早餐
  const carbShare = p.breakfastHabit === 'rarely' ? 0.08 : 0.22;
  const bf = buildBreakfast(p, m, sel, carbShare, exclude);
  meals.push(bf);
  let rem = subMacros(m, bf.macros);

  let snack1 = null, snack2 = null;
  if (p.mealCount === 5) {
    snack1 = buildSnack(sel, '上午加餐');
    rem = subMacros(rem, snack1.macros);
    snack2 = buildSnack(sel, '下午加餐');
    rem = subMacros(rem, snack2.macros);
  }

  // 午餐 + 晚餐 分摊剩余
  const dinnerEatOut = isEatOutScene(p.dinnerScene);
  const lunchShare = dinnerEatOut ? 0.60 : 0.52;
  const lunchT = scaleMacros(rem, lunchShare);
  const lunch = buildMainMeal(lunchT, sel, '午餐');
  const dinnerT = subMacros(rem, lunch.macros);
  const dinner = buildMainMeal(dinnerT, sel, '晚餐');

  if (p.mealCount === 5) meals.push(snack1);
  meals.push(lunch);
  if (p.mealCount === 5) meals.push(snack2);
  meals.push(dinner);

  const totals = meals.reduce((acc, me) => addMacros(acc, me.macros), { p: 0, f: 0, c: 0, kcal: 0 });
  return { error: null, meals, totals: roundMacros(totals), sel, remAfterDinner: dinnerT };
}

/* ---------------- [6] 采购汇总层 ---------------- */
function buildPurchasePlan(dayPlan) {
  // 汇总每日各食材克数
  const usage = new Map(); // name -> {grams, unit, qty}
  dayPlan.meals.forEach(me => {
    me.items.forEach(it => {
      const key = it.food.name;
      if (!usage.has(key)) usage.set(key, { food: it.food, grams: 0, qty: 0, unit: it.unit });
      const u = usage.get(key);
      u.grams += it.grams;
      u.qty += (it.qty || 0);
    });
  });
  const rows = [];
  usage.forEach(u => {
    const food = u.food;
    const weekG = u.grams * 7;
    const cat = food.cat;
    let buy = '', note = '';
    if (isEggFood(food)) {
      const weekEggs = Math.round(weekG / CFG.eggGrams);
      buy = weekEggs + ' 个';
      note = '按整数购买，约 ' + weekG + ' g';
    } else if (u.unit === 'ml') {
      const weekMl = Math.round(weekG * CFG.milkMlPerG);
      const liters = Math.ceil(weekMl / 250) * 0.25;
      buy = '约 ' + liters.toFixed(2).replace(/\.?0+$/, '') + ' L';
      note = '按常见包装向上取整（' + weekMl + ' ml）';
    } else if (cat === '油脂及其它') {
      const weekMl = Math.round(weekG * CFG.oilMlPerG);
      buy = '约 ' + Math.round(weekG) + ' g（约 ' + weekMl + ' ml）';
      note = '一瓶常用小瓶装约 500 ml';
    } else if (cat === '谷类' || cat === '干豆类') {
      buy = '约 ' + ceilPack(weekG) + ' kg';
      note = '干重，按常见包装向上取整';
    } else if (cat === '走兽类' || cat === '飞禽' || cat === '鱼类' || cat === '蛤类' || cat === '爬虫' || cat === '蛋类') {
      buy = '约 ' + ceilMeat(weekG) + ' g';
      note = '生重，按常见包装向上取整';
    } else if (cat.includes('菜') || cat === '菌类' || cat === '根茎类' || cat === '茄瓜果类' || cat === '鲜豆类' || cat === '豆类制品' || cat === '海菜类') {
      buy = '约 ' + Math.ceil(weekG / 250) * 250 + ' g';
      note = weekG > 1500 ? '易腐，建议分 2~3 次采购' : '注意保存周期';
    } else if (cat === '水果类') {
      buy = '约 ' + ceilPack(weekG) + ' kg';
      note = '按个/份购买';
    } else {
      buy = '约 ' + Math.round(weekG) + ' g';
      note = '按常见包装';
    }
    rows.push({ name: food.a, grams: Math.round(weekG), buy, note, cat });
  });
  // 优化排序：先主食/蛋白，后蔬菜水果
  const order = { '谷类': 1, '干豆类': 1, '豆类制品': 2, '走兽类': 3, '飞禽': 3, '鱼类': 3, '蛤类': 3, '爬虫': 3, '蛋类': 3, '乳类': 4, '油脂及其它': 5, '根茎类': 6, '鲜豆类': 6, '叶菜类': 6, '茄瓜果类': 6, '菌类': 6, '海菜类': 6, '水果类': 7 };
  rows.sort((a, b) => (order[a.cat] || 9) - (order[b.cat] || 9));
  return rows;
}
function ceilPack(g) { const kg = g / 1000; const steps = [0.25, 0.5, 1, 1.5, 2, 3, 5]; for (const s of steps) if (kg <= s) return s; return Math.ceil(kg); }
function ceilMeat(g) { const steps = [250, 500, 750, 1000, 1500, 2000, 3000, 5000]; for (const s of steps) if (g <= s) return s; return Math.ceil(g / 500) * 500; }

/* ---------------- [7] 结果验证层 ---------------- */
function runRealityCheck(p, targets, dayPlan) {
  const checks = [];
  // 检查一：营养达标
  const kcalErr = Math.abs(dayPlan.totals.kcal - targets.kcal);
  const kcalPct = targets.kcal > 0 ? kcalErr / targets.kcal * 100 : 0;
  const errOf = (actual, tgt) => Math.abs(actual - tgt);
  const pErr = targets.p > 0 ? errOf(dayPlan.totals.p, targets.p) / targets.p * 100 : 0;
  const fErr = targets.f > 0 ? errOf(dayPlan.totals.f, targets.f) / targets.f * 100 : 0;
  const cErr = targets.c > 0 ? errOf(dayPlan.totals.c, targets.c) / targets.c * 100 : 0;
  if (kcalPct <= 8 && pErr <= 15 && fErr <= 15 && cErr <= 15) {
    checks.push({ pass: true, text: '营养达标：全天热量与目标误差约 ' + Math.round(kcalPct) + '%，蛋白质/脂肪/碳水误差均在可接受范围内。' });
  } else {
    checks.push({ pass: false, text: '营养偏差偏大（热量误差 ' + Math.round(kcalPct) + '%）。已尽量贴近目标，可调整目标节奏或食材再试。' });
  }

  // 检查二：食材种类
  const names = new Set();
  dayPlan.meals.forEach(me => me.items.forEach(it => names.add(it.food.name)));
  if (names.size <= 12) checks.push({ pass: true, text: '全天食材约 ' + names.size + ' 种，种类适中，便于采购与复用。' });
  else checks.push({ pass: false, text: '全天食材 ' + names.size + ' 种，偏多，建议减少花样、提高复用。' });

  // 检查三：无法单独采购的小份量
  const tiny = [];
  dayPlan.meals.forEach(me => me.items.forEach(it => {
    if (it.unit === 'g' && it.grams > 0 && it.grams < 30 && it.food.cat !== '油脂及其它') tiny.push(it.food.a + ' ' + it.grams + 'g');
  }));
  if (!tiny.length) checks.push({ pass: true, text: '无 30g 以下的琐碎分量食材。' });
  else checks.push({ pass: false, text: '存在过小份量：' + tiny.join('、') + '，现实中难以单独采购，已尽量合并。' });

  // 检查四：易腐食材使用周期（只统计鲜蔬菌菇等不易长期存放的食材）
  const freshProduce = dayPlan.meals.reduce((s, me) => s + me.items.filter(it => ['叶菜类','茄瓜果类','菌类','鲜豆类'].includes(it.food.cat)).reduce((a, it) => a + it.grams, 0), 0);
  if (freshProduce * 7 <= 2000) checks.push({ pass: true, text: '鲜蔬菌菇 7 天约 ' + Math.round(freshProduce * 7 / 1000 * 10) / 10 + ' kg，采购与存放压力不大。' });
  else checks.push({ pass: false, text: '鲜蔬菌菇量较大（7 天约 ' + Math.round(freshProduce * 7 / 1000 * 10) / 10 + ' kg），建议分 2~3 次采购，肉类可冷冻存放。' });

  // 检查五：是否吃得下
  const eggsPerDay = dayPlan.meals.reduce((s, me) => s + me.items.filter(it => isEggFood(it.food)).reduce((a, it) => a + (it.qty || 0), 0), 0);
  const maxMealW = Math.max(...dayPlan.meals.map(me => me.items.reduce((a, it) => a + (it.grams || 0), 0)));
  if (eggsPerDay <= 4 && maxMealW <= 1000) checks.push({ pass: true, text: '单餐量与鸡蛋数量在合理范围内（每天 ' + eggsPerDay + ' 个鸡蛋）。' });
  else checks.push({ pass: false, text: '执行性存疑：每天 ' + eggsPerDay + ' 个鸡蛋或单餐总量 ' + maxMealW + 'g，明显不合理，请调整。' });

  return checks;
}

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function runPipeline() {
  const p = readProfile();
  setPdfBtn(false);
  lastResult = null;

  // 基本输入校验
  if (!(p.weight > 20 && p.height > 100 && p.age > 0)) {
    renderError('请先填写有效的身高、体重、年龄。');
    return;
  }

  const screen = healthScreen(p);
  const energy = computeEnergy(p);
  const macros = computeMacros(p, energy);

  const resultArea = document.getElementById('result-area');
  const placeholder = document.getElementById('placeholder-area');
  resultArea.innerHTML = '';
  resultArea.classList.remove('hidden');
  placeholder.style.display = 'none';

  const wrap = el('div');

  // —— 健康阻断 ——
  if (screen.level === 'block') {
    const b = el('div', 'banner risk');
    b.innerHTML = '<b>⚠️ 暂不生成普通减脂方案。</b>检测到：' + esc(screen.blocked.join('、')) +
      '。这类情况不能套用面向普通健康人群的通用计算公式，建议先咨询专业医疗或营养支持，待明确后再做计划。';
    wrap.appendChild(b);
    resultArea.appendChild(wrap);
    return;
  }

  // —— 风险提示（非阻断） ——
  screen.warnings.forEach(w => {
    const b = el('div', 'banner warn');
    b.innerHTML = '⚠️ ' + esc(w);
    wrap.appendChild(b);
  });

  // —— 宏量营养素冲突 ——
  if (macros.error === 'conflict') {
    const b = el('div', 'banner risk');
    b.innerHTML = '<b>当前目标热量无法同时满足设定的蛋白质与脂肪要求。</b>' +
      '估算下蛋白质约 ' + macros.protein + ' g、脂肪约 ' + macros.fat + ' g，已超过目标摄入 ' + energy.target + ' kcal。<br>' +
      '建议：选择更温和的减脂节奏、增加日常活动量，或寻求专业指导。';
    wrap.appendChild(b);
    wrap.appendChild(buildEnergyInfo(energy, macros, p));
    resultArea.appendChild(wrap);
    return;
  }

  // —— 目标热量过低（无法生成可执行配餐） ——
  const minKcal = minFeasibleKcal();
  if (energy.target < minKcal) {
    const b = el('div', 'banner risk');
    b.innerHTML = '<b>目标热量过低，无法生成可执行的一日三餐。</b>目标摄入 ' + energy.target + ' kcal，低于本工具能生成的最小可执行配餐（约 ' + minKcal + ' kcal）。' +
      '建议选择更温和的减脂节奏，或增加日常活动量以提高消耗，而不是继续压低热量。';
    wrap.appendChild(b);
    wrap.appendChild(buildEnergyInfo(energy, macros, p));
    resultArea.appendChild(wrap);
    return;
  }

  // —— 目标异常提示 ——
  if (energy.target < energy.bmr) {
    const b = el('div', 'banner warn');
    b.innerHTML = '⚠️ 你的目标摄入（' + energy.target + ' kcal）低于基础代谢估算值（' + energy.bmr + ' kcal），缺口较大，可能较难长期坚持。建议优先增加日常活动量或选择更温和的节奏。';
    wrap.appendChild(b);
  }

  const targets = { p: macros.protein, f: macros.fat, c: macros.carb, kcal: macros.totalKcal };

  // —— 生成食谱 ——
  const dayPlan = generateDayPlan(p, targets);
  if (dayPlan.error === 'db_insufficient') {
    const b = el('div', 'banner risk');
    b.innerHTML = '<b>食物数据库覆盖不足。</b>当前食物数据库在你所填的过敏/禁忌限制下，找不到足够的主食或蛋白食材完成配餐。为避免虚构营养数据，暂不生成食谱。请调整饮食禁忌，或补充更多可用食材信息。';
    wrap.appendChild(b);
    wrap.appendChild(buildEnergyInfo(energy, macros, p));
    resultArea.appendChild(wrap);
    return;
  }

  const checks = runRealityCheck(p, targets, dayPlan);
  lastResult = { p, screen, energy, macros, targets, dayPlan, checks };

  // —— 第一层：每日目标 ——
  wrap.appendChild(buildDailyTarget(energy, macros));
  // —— 第二层：怎么吃 ——
  wrap.appendChild(buildMeals(p, dayPlan, targets, checks));
  // —— 第三层：怎么采购 ——
  wrap.appendChild(buildPurchase(p, dayPlan));
  // —— 第四层：为什么这么安排 ——
  wrap.appendChild(buildExplanation(p, energy, macros, dayPlan));

  resultArea.appendChild(wrap);
  setPdfBtn(true);
  resultArea.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function buildMeals(p, dayPlan, targets, checks) {
  const card = el('div', 'card');
  const h = el('h2'); h.innerHTML = '<span class="icon" style="background:#f0fdf4;color:var(--green);">🍽️</span> 每天怎么吃';

    me.items.forEach(it => {
      const row = el('div', 'meal-item');

      mc.appendChild(row);
    });

  });

  // 替换机制（同类下拉框替换，选择后自动重新计算）
  const swapBox = el('div', 'swap-selects');
  const swapNote = el('div', 'swap-note');
  swapNote.textContent = '同类替换：从下拉框选想吃的食材，系统会自动重新计算营养';
  swapBox.appendChild(swapNote);
  const exclude = collectExcludedFoods(p);
  const roleLists = [
    ['protein', ROLES.protein, '蛋白质'],
    ['staple', ROLES.staple, '主食'],
    ['veg', ROLES.veg, '蔬菜'],

      const opt = el('option');
      opt.value = '';
      opt.textContent = '无可用食材';
      sel.appendChild(opt);
      sel.disabled = true;
    } else {
      const cur = dayPlan.sel[role];
      avail.forEach(name => {
        const opt = el('option');
        opt.value = name;
        opt.textContent = byName(name).a;
        if (name === cur) opt.selected = true;
        sel.appendChild(opt);
      });
      sel.addEventListener('change', () => selectRoleFood(role, sel.value));
    }
    g.appendChild(sel);
    swapBox.appendChild(g);
  });
  card.appendChild(swapBox);

  // 现实执行检查器（已在管线中计算，避免重复）
  const ck = el('div', 'section-title'); ck.innerHTML = '<span class="icon" style="background:#fff7ed;color:var(--orange);">🔍</span> 现实执行检查';

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

/* ---------------- 食材替换（下拉框选择食材后，重新计算） ---------------- */
function selectRoleFood(role, pickedName) {
  if (!pickedName) return;
  const p = readProfile();
  const exclude = collectExcludedFoods(p);
  const list = role === 'protein' ? ROLES.protein : role === 'staple' ? ROLES.staple : role === 'veg' ? ROLES.veg : ROLES.oil;
  const avail = list.filter(n => !exclude.has(n));
  if (!avail.includes(pickedName)) return;
  const newList = [pickedName, ...avail.filter(n => n !== pickedName)];
  if (role === 'protein') ROLES.protein = newList;
  else if (role === 'staple') ROLES.staple = newList;
  else if (role === 'veg') ROLES.veg = newList;
  else ROLES.oil = newList;
  runPipeline();
}

function loadScript(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src;
    s.onload = () => resolve();
    s.onerror = () => reject(new Error('脚本加载失败：' + src));
    document.head.appendChild(s);
  });
}

async function downloadPdf() {
  const btn = document.getElementById('pdfBtn');
  if (!lastResult) return;
  const holder = document.getElementById('pdfHolder');
  try {
    if (btn) { btn.disabled = true; btn.textContent = '⏳ 正在生成 PDF…'; }
    await ensurePdfLibs();
    holder.innerHTML = '';
    buildReportSections(lastResult).forEach(sec => holder.appendChild(sec));

    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
    const pageW = 210, pageH = 297, margin = 10, contentW = pageW - margin * 2, fullH = pageH - margin * 2;
    const secs = Array.from(holder.querySelectorAll('.sec'));
    let y = margin;
    for (const sec of secs) {
      const canvas = await html2canvas(sec, { scale: 2, useCORS: true, backgroundColor: '#ffffff', scrollX: 0, scrollY: -window.scrollY });
      const imgH = canvas.height * contentW / canvas.width;
      if (imgH <= fullH) {
        if (y + imgH > pageH - margin) { pdf.addPage(); y = margin; }
        pdf.addImage(canvas.toDataURL('image/jpeg', 0.95), 'JPEG', margin, y, contentW, imgH);
        y += imgH + 6;
      } else {
        // 单区块超过一整页时切片
        if (y > margin) { pdf.addPage(); y = margin; }
        const pxPerMm = canvas.width / contentW;
        let srcY = 0, segMm = 0;
        while (srcY < canvas.height) {
          let segPx = Math.min(Math.round(fullH * pxPerMm), canvas.height - srcY);
          const c2 = document.createElement('canvas');
          c2.width = canvas.width; c2.height = segPx;
          c2.getContext('2d').drawImage(canvas, 0, srcY, canvas.width, segPx, 0, 0, c2.width, c2.height);
          segMm = segPx / pxPerMm;
          pdf.addImage(c2.toDataURL('image/jpeg', 0.95), 'JPEG', margin, margin, contentW, segMm);
          srcY += segPx;
          if (srcY < canvas.height) pdf.addPage();
        }
        y = margin + segMm + 6;
      }
    }
    pdf.save('带电操作减脂食谱_' + todayStr() + '.pdf');
  } catch (err) {
    console.error('PDF 生成失败，改用浏览器打印兜底：', err);
    if (!holder.children.length) buildReportSections(lastResult).forEach(sec => holder.appendChild(sec));
    if (typeof window.print === 'function') window.print();
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '⬇ 保存 PDF'; }
  }
}

/* ---------------- 浮动「生成我的减脂方案」按钮：生成方案后、按钮不在视口内时悬浮，滑回原位时归位 ---------------- */
function updateCalcFloat() {
  const orig = document.getElementById('calcBtn');
  const floatBtn = document.getElementById('calcFloatBtn');
  if (!orig || !floatBtn) return;
  const pdfBtn = document.getElementById('pdfBtn');
  const resultGenerated = pdfBtn && !pdfBtn.classList.contains('hidden');
  const rect = orig.getBoundingClientRect();
  const vh = window.innerHeight;
  // 按钮完全在视口上方或下方（不在视口内）时悬浮；未生成结果时不悬浮，避免遮挡表单
  const outOfView = rect.top >= vh || rect.bottom <= 0;
  floatBtn.classList.toggle('show', resultGenerated && outOfView);
  // 移动端单列布局时与「保存 PDF」按钮垂直错开，避免互相遮挡
  const isMobile = window.innerWidth <= 900;
  floatBtn.style.bottom = (resultGenerated && isMobile) ? '82px' : '20px';
}

if (typeof window !== 'undefined') {
  window.addEventListener('DOMContentLoaded', () => {
    initAllergyChecks();
    updateCalcFloat();

  window.addEventListener('scroll', updateCalcFloat, { passive: true });
  window.addEventListener('resize', updateCalcFloat);
}
